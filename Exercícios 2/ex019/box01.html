<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
       h1 { /* -box-level- */
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;

        background-color: lightgreen;
        height: 300px;
        width: 300px;
        border-width: 10px;
        border-style: solid;
        border-color: darkslategrey;

        outline-width: 10px;
        outline-style: dashed;
        outline-color: salmon;

        padding-top: 10px;
        padding-right: 10px;
        padding-bottom: 10px;
        padding-left: 10px;

        margin-top: 10px;
        margin-right: auto;
        margin-bottom: 10px;
        margin-left: auto;

       /*
        shorthands:
         border: width style color;
         outline: width style color
         padding: top right bottom left
         margin: top right bottom left
       */ 

       }

       a { /* -inline-level- */ 
        border: 5px solid red;
        padding: 10px;
       }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>
        Parágrafos também são exemplos de box-level, mas os <a href="#">
            links são exemplos de caixas inline-level.</a>
        Vamos ver como tudo isso funciona.
    </p>
</body>
</html>
