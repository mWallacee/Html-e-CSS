<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para 
    descobrir qual tag deverá utilizar em cada caso.
    </p>
    <ul type="square">
        <li title="Use a tag <p>">Páragrafo</li>
        <li title="Use a tag <h1>">Título</li>
        <li title="Use a tag <img>">Imagens</li>
        <li Title="Use a tag <abbr>">Abreviações</li>
        <li title="Use a tag <code>">Código-Fonte</li>
        <li title="Use a tag <ol>">Listas Numeradas</li>
        <li title="Use a tag <ul>">Listas com Demarcadores</li>
    </ul>
</body>
</html>
